name: Spec auto-render

on:
  push:
    paths:
      - "spec.json"
      - "scripts/render_spec.py"
      - ".github/workflows/spec-auto-render.yml"

permissions:
  contents: write

concurrency:
  group: spec-auto-render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate spec.json
        run: python3 -m json.tool spec.json > /dev/null

      - name: Render derivatives
        run: python3 scripts/render_spec.py

      - name: Commit and push if i18n changed
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain i18n/)" ]; then
            echo "No i18n changes after render."
            exit 0
          fi

          LAST_AUTHOR="$(git log -1 --pretty=format:'%an')"
          if [ "$LAST_AUTHOR" = "github-actions[bot]" ]; then
            echo "Regeneration is still dirty after a bot commit; check for nondeterminism or a bad committed state."
            git diff --stat -- i18n/
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add i18n/
          git commit -m "chore: regenerate spec derivatives"
          git push origin "HEAD:${{ github.ref_name }}"
